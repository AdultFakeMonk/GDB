name: Check Gersang notices and events

on:
  schedule:
    # main.py가 3회x150초 = 약 7.5분간 실행되므로
    # 안전하게 20분마다 1회 실행 (overlap 방지)
    - cron: "0,20,40 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gersang-news-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check notices and events
        env:
          DISCORD_NOTICE_WEBHOOK_URL: ${{ secrets.DISCORD_NOTICE_WEBHOOK_URL }}
          DISCORD_EVENT_WEBHOOK_URL: ${{ secrets.DISCORD_EVENT_WEBHOOK_URL }}
          MAX_SEND_PER_RUN: "5"
          RUN_CYCLES: "3"
          CYCLE_DELAY_SECONDS: "150"
        run: python main.py

      - name: Save state
        run: |
          if git diff --quiet -- last_seen.json; then
            echo "No state change"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add last_seen.json
          git commit -m "Update Gersang watcher state"

          # push 실패 시 최대 3회 재시도 (동시 실행 충돌 방지)
          for i in 1 2 3; do
            git push && echo "Push success" && exit 0
            echo "Push failed (attempt $i/3), pulling and retrying..."
            git pull --rebase origin main
          done
          echo "Push failed after 3 attempts"
          exit 1
